name: Build OpenWrt Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64_generic ]
    steps:
      - uses: actions/checkout@v4

      - name: Build with SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: netoptimizer_feed
          PACKAGES: openwrt-netoptimizer
          EXTRA_FEEDS: src-git|daede|https://github.com/kenzok8/openwrt-daede
          V: s

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore

      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin/packages bin/targets -type f \( -name '*.apk' -o -name '*.ipk' \) -exec cp {} out/ \;
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::no packages produced - check build log for deselected dependencies"
            exit 1
          fi
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netoptimizer-${{ matrix.arch }}
          path: out/*
